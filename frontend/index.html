<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Tracker - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-brand">

            <div class="brand-icon">
                💼
            </div>

            <h1>Job Tracker</h1>

            <p>
                Track your job applications,
                interviews and career progress.
            </p>

            <div class="brand-features">
                <div>✓ Organize your applications</div>
                <div>✓ Keep track of interviews</div>
                <div>✓ Never miss a deadline</div>
            </div>

            <span class="brand-tagline">
                Better tracking → Better opportunities
            </span>

        </div>


        <div class="login-form-container">

            <div class="login-form">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Sign in to your account
                </p>


                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>

                </form>


                <p id="message"></p>


                <p class="signup-text">
                    Don't have an account?
                    <a href="signupLink">Sign Up</a>
                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
