<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-icon">💼</div>

            <h1>Job Tracker</h1>

            <p>
                Track your job applications, interviews and career progress.
            </p>

            <div class="brand-features">
                <div>✓ Organize your applications</div>
                <div>✓ Keep track of interviews</div>
                <div>✓ Never miss a deadline</div>
            </div>

            <span class="brand-tagline">
                Better tracking → Better opportunities
            </span>
        </div>


        <div class="login-form-container">

            <div class="login-form">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Sign up to start tracking your applications
                </p>


                <form id="signupForm">

                    <div class="input-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >
                    </div>


                    <button
                        type="submit"
                        class="login-button"
                    >
                        Create Account
                    </button>

                </form>


                <p id="signupMessage"></p>


                <p class="signup-text">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/signup.js"></script>

</body>

</html>
